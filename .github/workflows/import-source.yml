name: Import Source Package

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download package
        env:
          SRC: https://aka.doubaocdn.com/s/vN7SgU5nnu
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/pkg.zip "$SRC"
          ls -l /tmp/pkg.zip
          rm -rf /tmp/pkg && mkdir -p /tmp/pkg
          unzip -q /tmp/pkg.zip -d /tmp/pkg
          find /tmp/pkg -maxdepth 2 -type f | head -30

      - name: Sync tree (清空旧内容，保留工作流)
        run: |
          set -euo pipefail
          SRC_DIR=$(find /tmp/pkg -maxdepth 1 -mindepth 1 -type d -name '*_src' | head -1)
          echo "src=$SRC_DIR"
          test -f "$SRC_DIR/KakaVoicePro.m"
          grep -q 'kpa_decrypt_ecb' "$SRC_DIR/KakaVoicePro.m"
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -R "$SRC_DIR"/. .
          ls -la

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "kaka-import-bot"
          git config user.email "kaka-import-bot@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "import: KakaVoicePro v29.8 完整源码包（清空重建）"
          git push origin HEAD:main

      - name: Dispatch build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
