name: Build KakaVoicePro

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: /Users/runner/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check source present
        run: |
          ls -la
          test -f KakaVoicePro.m || { echo "::error::缺少 KakaVoicePro.m，无法编译"; exit 1; }

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS*.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          ls -1 "$THEOS/sdks"

      - name: Install ldid
        run: |
          brew install ldid || brew install dpkg || true
          which ldid || echo "ldid still missing"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          make -j"$(sysctl -n hw.ncpu)" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show output
        if: always()
        run: find .theos/obj -name '*.dylib' -exec file {} \; || true

      - name: Upload dylib
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: KakaVoicePro-dylib
          path: .theos/obj/**/*.dylib

      - name: Publish build log
        if: steps.build.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "kaka-ci-bot"
          git config user.email "kaka-ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          cp "$RUNNER_TEMP/build.log" build.log
          git add -f build.log
          git commit -m "ci: build log (run ${{ github.run_number }}) [skip ci]"
          git push -f origin ci-logs

      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
