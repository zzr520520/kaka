name: Bootstrap Source

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch KakaVoicePro.m
        env:
          SRC: https://aka.doubaocdn.com/s/WYGyInqB6h
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o KakaVoicePro.m "$SRC"
          SIZE=$(wc -c < KakaVoicePro.m)
          echo "size=$SIZE"
          test "$SIZE" -gt 100000
          grep -q 'kpa_decrypt_ecb' KakaVoicePro.m
          grep -q 'crypto_sign_open' KakaVoicePro.m

      - name: Fetch tweetnacl
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o tweetnacl.h https://tweetnacl.cr.yp.to/20140427/tweetnacl.h
          curl -fsSL --retry 3 -o tweetnacl.c https://tweetnacl.cr.yp.to/20140427/tweetnacl.c
          wc -c tweetnacl.h tweetnacl.c

      - name: Commit source
        run: |
          set -euo pipefail
          git config user.name "kaka-bootstrap"
          git config user.email "kaka-bootstrap@users.noreply.github.com"
          git add KakaVoicePro.m tweetnacl.h tweetnacl.c
          git diff --cached --stat
          git commit -m "bootstrap: 写入 Kaka.m 实际实现（KP_VERSION v29.8）与 tweetnacl 依赖"
          git push origin HEAD:main

      - name: Dispatch build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}'
